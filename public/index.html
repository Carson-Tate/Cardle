<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardle — Daily Poker Puzzle</title>
  <!-- Tab icon (DESIGN.md §11i). Declared explicitly because the site is served
       from /public via a rewrite, so a browser's default /favicon.ico probe
       would 404. `sizes="any"` lets the one SVG serve every context. -->
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="/public/favicon.svg" />
  <meta name="theme-color" content="#2f6f4f" />
  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body>
  <header id="site-header">
    <div class="site-header-left">
      <button type="button" id="header-logo" class="header-logo">Cardle</button>
      <button type="button" id="header-help" class="header-help" aria-label="How to play">?</button>
    </div>
    <div class="site-header-right">
      <!-- Order matters: navigation first, then the player's own nameplate in
           the RIGHTMOST slot (owner request). The auth slot is last so your name
           always sits at the far edge whether or not the Friends and Admin
           buttons are showing — with it in the middle, the position of your own
           name shifted depending on whether you were an admin.

           On narrow screens `.header-nav` collapses into the hamburger below
           (owner request) while the auth slot stays put, so the XP bar remains
           glanceable and the XP-gain animation keeps a visible target to fly
           into. The SAME buttons serve both layouts — a second copy inside the
           menu would need every `hidden` rule applied twice, and the Admin
           button being wrongly visible is a mistake this project has already
           made once (§11n). -->
      <div class="header-nav" id="header-nav">
        <button type="button" id="header-leaderboard-btn" class="header-friends-btn" aria-label="Leaderboards">🏆<span class="header-leaderboard-label"> Leaderboards</span></button>
        <button type="button" id="header-friends-btn" class="header-friends-btn" hidden>Friends</button>
        <!-- Shown only for admins. This is presentation, not access control —
             the database authorizes every admin action (DESIGN.md §11f). -->
        <button type="button" id="header-admin-btn" class="header-admin-btn" aria-label="Admin" hidden>🛠️<span class="header-admin-label"> Admin</span></button>
      </div>
      <div id="header-auth-slot"></div>
      <!-- Rendered at every width but only DISPLAYED under the mobile
           breakpoint, so there is no markup swap at the boundary. -->
      <button type="button" id="header-menu-btn" class="header-menu-btn" aria-label="Menu"
              aria-expanded="false" aria-controls="header-nav">☰</button>
    </div>
  </header>
  <div id="app">
    <header>
      <p id="day-label">Loading today's hand…</p>
      <p id="modifier-banner" class="modifier-banner" hidden></p>
      <p id="anon-hint" class="anon-hint" hidden></p>
      <!-- Countdown to the next hand (DESIGN.md §11l). Populated by board.js. -->
      <p id="next-reset" class="next-reset" hidden></p>
    </header>
    <main>
      <button type="button" id="draw-btn" class="draw-btn" hidden>🂠 Draw</button>
      <div id="hand-row" class="hand-row"></div>
      <div id="controls">
        <!-- The hint and the Share button share one centred row (owner request:
             Share "to the right of the come back tomorrow" and "center the whole
             thing"). Share stays `hidden` until a run has actually been scored —
             it has nothing to share before that, and its handler is not attached
             until the fortune renders. -->
        <div class="hint-row">
          <p id="discard-hint"></p>
          <button type="button" class="copy-btn share-btn" id="share-btn" hidden>📋 Share</button>
        </div>
        <div id="wager-prompt" class="wager-prompt" hidden>
          <p id="wager-prompt-text">You've seen 2 cards. Go for it?</p>
          <div class="wager-prompt-actions">
            <button id="wager-yes-btn" class="wager-btn wager-btn--risk">🎲 Double or Nothing</button>
            <button id="wager-no-btn" class="wager-btn wager-btn--safe">🛡️ Play It Safe</button>
          </div>
        </div>
        <button id="lock-in-btn" hidden>Lock In</button>
      </div>
      <section id="result" class="result" hidden></section>
    </main>
  </div>
  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
