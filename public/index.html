<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Ads tag (gtag.js) — conversion tracking and remarketing for the
       cardle.lol ad campaign (DESIGN.md §11ae).

       PLACED AFTER <meta charset>, not literally first. Google's instructions
       say "immediately after the <head> element"; the charset declaration has
       to land inside the first 1024 bytes or the browser may guess an encoding
       and re-parse, and this snippet is ~350 bytes of that budget. Sitting
       second costs nothing — the tag is `async`, so what matters is that the
       request starts early, not that it is byte zero.

       IT WILL UNDERCOUNT, and that is expected rather than a fault to chase.
       googletagmanager.com is on every ad blocker's default list, so a
       meaningful share of real visits will never report. §11w already learned
       this the hard way when a blocker ate the Share button. Treat the numbers
       as a floor and a trend, not a headcount.

       This is the project's SECOND external dependency, after esm.sh's Supabase
       SDK. Worth stating plainly because the rule elsewhere has been to avoid
       them (§11v declined a remote image for the support link on exactly these
       grounds). It is `async` and nothing waits on it, so the game still loads
       and plays normally when it is blocked, throttled or down. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18368131357"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'AW-18368131357');
  </script>

  <title>Cardle — Daily Poker Puzzle</title>
  <!-- Tab icon (DESIGN.md §11i). Declared explicitly because the site is served
       from /public via a rewrite, so a browser's default /favicon.ico probe
       would 404. `sizes="any"` lets the one SVG serve every context. -->
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="/public/favicon.svg" />
  <meta name="theme-color" content="#2f6f4f" />

  <!-- SEARCH ENGINES (DESIGN.md §11w). This is a static single-page app whose
       body is empty until JavaScript runs, so everything a crawler can rely on
       has to be here in the head. Google does execute JS, but on a second pass
       that can lag by days — the description below is what appears in results
       until then, and for Bing and every social unfurler it is all there is.

       Deliberately generic rather than describing TODAY's hand: the page is
       re-crawled on its own schedule, so anything day-specific would be stale
       and wrong most of the time. -->
  <!-- ACCURACY NOTE: do not write "the same cards for everyone" here. Hands are
       dealt RANDOMLY PER PLAYER (state/persistence.js — the shared date-derived
       seed was deliberately removed). What IS shared on a given day is the
       Daily Modifier and the day number, not the deal. An earlier version of
       this tag claimed otherwise and shipped, so it was wrong in every link
       preview until someone noticed. -->
  <meta name="description"
        content="Cardle is a free daily poker puzzle. One five-card hand a day, dealt just for you — choose your discards, build the best hand you can, and see how your score stacks up." />
  <!-- The site is served from /public via a rewrite, so the same content is
       reachable at more than one path. This names the one that counts.

       It is the HOMEPAGE's canonical and no longer every route's. It used to be
       both, to stop the query-param routes (?profile, ?leaderboard, ?admin)
       being indexed as thin pages competing with the homepage — correct while
       they rendered an empty shell to anyone without a session, and no longer
       true since §11ac opened the boards and profiles to signed-out visitors.
       src/ui/page-meta.js now rewrites this per route (§11ad), and points the
       ones that should stay out of the index at `noindex` instead, which is the
       precise tool for that job. This static value is what a crawler's first,
       pre-JavaScript pass sees, so it must stay correct FOR THE HOMEPAGE — that
       is the page most first passes are actually looking at. -->
  <link rel="canonical" href="https://cardle.lol/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cardle.lol/" />
  <meta property="og:site_name" content="Cardle" />
  <meta property="og:title" content="Cardle — Daily Poker Puzzle" />
  <meta property="og:description"
        content="One poker hand a day, dealt just for you. Pick your discards, chase the best hand you can, and see how your score stacks up." />
  <!-- The favicon doubles as the preview image: it is the only graphic the
       project has, and an unfurled link with no image at all reads as broken.
       SVG is not accepted by every unfurler, so this is a known-imperfect
       placeholder — a 1200x630 PNG is the upgrade if link previews matter. -->
  <meta property="og:image" content="https://cardle.lol/public/favicon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Cardle — Daily Poker Puzzle" />
  <meta name="twitter:description"
        content="One poker hand a day, dealt just for you. Pick your discards, chase the best hand you can, and see how your score stacks up." />

  <!-- Structured data. `VideoGame` + `WebSite` is the honest pair for what this
       is; Google uses it to understand the entity behind the domain rather than
       to draw a rich result, so there is no snippet to lose if it is ignored. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Cardle",
    "url": "https://cardle.lol/",
    "description": "A free daily poker puzzle. One five-card hand a day, dealt fresh for every player.",
    "genre": ["Puzzle", "Card Game"],
    "playMode": "SinglePlayer",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <!-- The auth SDK is fetched from these at sign-in time (state/supabase-client.js).
       Warming the connection here means the TLS handshake is already done when a
       player taps Log In, which matters most on the mobile connections where
       that import has been timing out. Both origins are listed because the
       second is the fallback. -->
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body>
  <header id="site-header">
    <div class="site-header-left">
      <button type="button" id="header-logo" class="header-logo">Cardle</button>
      <button type="button" id="header-help" class="header-help" aria-label="How to play">?</button>
    </div>
    <div class="site-header-right">
      <!-- Order matters: navigation first, then the player's own nameplate in
           the RIGHTMOST slot (owner request). The auth slot is last so your name
           always sits at the far edge whether or not the Friends and Admin
           buttons are showing — with it in the middle, the position of your own
           name shifted depending on whether you were an admin.

           On narrow screens `.header-nav` collapses into the hamburger below
           (owner request) while the auth slot stays put, so the XP bar remains
           glanceable and the XP-gain animation keeps a visible target to fly
           into. The SAME buttons serve both layouts — a second copy inside the
           menu would need every `hidden` rule applied twice, and the Admin
           button being wrongly visible is a mistake this project has already
           made once (§11n). -->
      <div class="header-nav" id="header-nav">
        <button type="button" id="header-leaderboard-btn" class="header-friends-btn" aria-label="Leaderboards">🏆<span class="header-leaderboard-label"> Leaderboards</span></button>
        <button type="button" id="header-friends-btn" class="header-friends-btn" hidden>Friends</button>
        <!-- Shown only for admins. This is presentation, not access control —
             the database authorizes every admin action (DESIGN.md §11f). -->
        <button type="button" id="header-admin-btn" class="header-admin-btn" aria-label="Admin" hidden>🛠️<span class="header-admin-label"> Admin</span></button>
      </div>
      <div id="header-auth-slot"></div>
      <!-- Rendered at every width but only DISPLAYED under the mobile
           breakpoint, so there is no markup swap at the boundary. -->
      <button type="button" id="header-menu-btn" class="header-menu-btn" aria-label="Menu"
              aria-expanded="false" aria-controls="header-nav">☰</button>
    </div>
  </header>
  <div id="app">
    <header>
      <p id="day-label">Loading today's hand…</p>
      <p id="modifier-banner" class="modifier-banner" hidden></p>
      <p id="anon-hint" class="anon-hint" hidden></p>
      <!-- Countdown to the next hand (DESIGN.md §11l). Populated by board.js. -->
      <p id="next-reset" class="next-reset" hidden></p>
    </header>
    <main>
      <button type="button" id="draw-btn" class="draw-btn" hidden>🂠 Draw</button>
      <div id="hand-row" class="hand-row"></div>
      <div id="controls">
        <!-- The hint and the Share button share one centred row (owner request:
             Share "to the right of the come back tomorrow" and "center the whole
             thing"). It stays `hidden` until a run has actually been scored —
             it has nothing to share before that, and its handler is not attached
             until the fortune renders.

             NAMED `result-copy-btn`, NOT `share-btn` (owner: "share button being
             blocked by some ad blockers"). EasyList and Fanboy's social lists
             carry generic cosmetic rules on the token `share-btn`, and this
             element used it as BOTH its class and its id, so either form of the
             rule matched. The result was invisible-by-design: a cosmetic filter
             injects `display: none !important`, which beats `hidden = false`, so
             the button simply never appeared and nothing errored. Nothing here
             is a social widget — the button copies text to the clipboard and
             makes no network request at all — so matching that filter was pure
             collateral damage. Keep the word "share" out of the class and id;
             the visible LABEL is what the player reads, and filter lists match
             selectors, not text. -->
        <div class="hint-row">
          <p id="discard-hint"></p>
          <button type="button" class="copy-btn result-copy-btn" id="result-copy-btn" hidden>📋 Share</button>
        </div>
        <div id="wager-prompt" class="wager-prompt" hidden>
          <p id="wager-prompt-text">You've seen 2 cards. Go for it?</p>
          <div class="wager-prompt-actions">
            <button id="wager-yes-btn" class="wager-btn wager-btn--risk">🎲 Double or Nothing</button>
            <button id="wager-no-btn" class="wager-btn wager-btn--safe">🛡️ Play It Safe</button>
          </div>
        </div>
        <button id="lock-in-btn" hidden>Lock In</button>
      </div>
      <section id="result" class="result" hidden></section>
    </main>
  </div>
  <!-- Site-wide, so it sits below whichever view `#app` rendered — the board,
       the profile, the leaderboards or the admin page — rather than being tied
       to one of them. A plain text link, not Buy Me a Coffee's branded button:
       that is a remote image, and this project loads no third-party assets
       (one CDN module and nothing else), so an image here would be a new
       external request that ad blockers routinely stop anyway.
       `rel="noopener"` because `target="_blank"` otherwise hands the opened tab
       a reference to this one via `window.opener`. -->
  <footer id="site-footer">
    <p>
      Cardle is free to play.
      <a href="https://buymeacoffee.com/cardle" target="_blank" rel="noopener noreferrer">Buy me a coffee ☕</a>
      to help keep it running.
    </p>
  </footer>
  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
